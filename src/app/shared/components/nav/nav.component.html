<nav class="lp-nav" [class.is-open]="menuOpen()">
  <div class="lp-nav__inner" [class.lp-nav__inner--has-back]="!!backLink()">

    @if (backLink()) {
      <a [routerLink]="backLink()" class="lp-nav__back" (click)="closeMenu()">{{ 'nav.gallery' | translate }}</a>
    }

    <a [href]="logoHref()" class="lp-nav__logo">{{ logoText() }}</a>

    <div class="lp-nav__links" role="list">
      @for (link of links(); track link.href) {
        @if (link.isCta) {
          <a [href]="link.href" (click)="closeMenu()">
            <luster-button
              [attr.variant]="link.ctaVariant ?? 'primary'"
              [attr.size]="link.ctaSize ?? 'sm'">
              {{ link.label }}
            </luster-button>
          </a>
        } @else {
          <a
            [href]="link.href"
            role="listitem"
            class="lp-nav__link"
            [class.lp-nav__link--active]="link.activeId && activeSection() === link.activeId"
            (click)="closeMenu()">
            {{ link.label }}
          </a>
        }
      }
    </div>

    <!-- Language dropdown -->
    <div class="lp-lang-select" [class.is-open]="langOpen()" (click)="$event.stopPropagation()">
      <button class="lp-lang-select__trigger" (click)="toggleLang()" type="button"
              [attr.aria-expanded]="langOpen()" aria-haspopup="listbox">
        {{ i18n.lang() === 'pt-BR' ? 'PT' : 'EN' }}
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
          <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="lp-lang-select__panel" role="listbox">
        <button class="lp-lang-select__option" role="option"
                [class.is-active]="i18n.lang() === 'pt-BR'"
                (click)="setLang('pt-BR')" type="button">
          <span class="lp-lang-select__code">PT</span>
          Português
        </button>
        <button class="lp-lang-select__option" role="option"
                [class.is-active]="i18n.lang() === 'en-US'"
                (click)="setLang('en-US')" type="button">
          <span class="lp-lang-select__code">EN</span>
          English
        </button>
      </div>
    </div>

    <button
      class="lp-nav__hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="'nav.openMenu' | translate">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="lp-nav__mobile" [attr.aria-label]="'nav.mobileNav' | translate">
    @for (link of links(); track link.href) {
      <a [href]="link.href" class="lp-nav__mobile-link" (click)="closeMenu()">
        {{ link.label }}
      </a>
    }
    <!-- Language switcher in mobile menu -->
    <div class="lp-nav__mobile-lang">
      <button class="lp-nav__mobile-lang-btn" [class.is-active]="i18n.lang() === 'pt-BR'"
              (click)="setLang('pt-BR')" type="button">PT — Português</button>
      <button class="lp-nav__mobile-lang-btn" [class.is-active]="i18n.lang() === 'en-US'"
              (click)="setLang('en-US')" type="button">EN — English</button>
    </div>
  </nav>
</nav>
